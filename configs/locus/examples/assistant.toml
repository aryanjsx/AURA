# Assistant — an agent that uses tools to do tasks, not only chat
# Copy to ~/.locus/config.toml
#
# An agent with tools that only read, or write to Locus's own memory. For
# writing files and running commands, turn on Agent mode in the desktop app or
# browser GUI: it asks you in the chat before each of those calls.
#
# Usage:
#   locus ask "How many PDFs are in my Downloads folder?"
#   locus serve                 # chat requests use this agent by default

[engine]
default = "ollama"

[intelligence]
default_model = "qwen3.5:9b"        # Small models often miss tool calls
# default_model = "qwen3.5:4b"     # For 8 GB machines; less reliable

[agent]
default_agent = "orchestrator"      # Multi-turn with tool selection
max_turns = 25

[server]
agent = "orchestrator"
host = "127.0.0.1"
port = 8000

[tools]
enabled = [
    "think", "calculator", "file_read", "pdf_extract", "memory_manage",
    "git_status", "git_diff", "git_log",
]

[security]
allowed_dirs = ["~"]                # File tools stay in your home folder
